# SPDX-License-Identifier: Apache-2.0
# OpenMyGlass: checks for our changes on branch glass-4.4. The full AOSP build runs from
# OpenMyGlass/manifest (Actions, build); this job needs no AOSP tree.
name: glass-checks
on:
  push:
    branches: [glass-4.4]
  pull_request:
permissions:
  contents: read
jobs:
  glass-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # android-security/android_frameworks_base aosp-4.4, the base of branch glass-4.4.
      BASE_COMMIT: 1056ab76ec6a40fda1634f2d40c8ef82a50f5019
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
      - name: The public API is unchanged (apps that target API 19 or lower keep working)
        run: git diff --exit-code --stat "$BASE_COMMIT" HEAD -- api/
      - name: Host tests (plain Java, no Android classes)
        run: |
          set -e
          found=0
          for t in services/tests/glass/*Test.java; do
            [ -e "$t" ] || continue
            found=1
            out=$RUNNER_TEMP/classes; rm -rf "$out"; mkdir -p "$out"
            # Each test lists the sources it needs in a "// sources:" line.
            srcs=$(sed -n 's|^// sources: ||p' "$t")
            javac -Xlint:all -Werror -d "$out" $srcs "$t"
            pkg=$(sed -n 's/^package \(.*\);$/\1/p' "$t")
            java -ea -cp "$out" "$pkg.$(basename "$t" .java)"
          done
          [ "$found" = 1 ] || echo "no host tests yet"
